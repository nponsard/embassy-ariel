[package]
edition = "2021"
name = "embassy-boot-stm32l4-examples"
version = "0.1.0"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
embassy-sync = { version = "0.7.2" }
embassy-executor = { version = "0.9.0", features = ["arch-cortex-m", "executor-thread"] }
embassy-time = { version = "0.5.0", features = [ "tick-hz-32_768"] }
embassy-stm32 = { version = "0.4.0", features = ["stm32l475vg", "time-driver-any", "exti"]  }
embassy-boot-stm32 = { version = "0.6.0", features = [] }
embassy-embedded-hal = { version = "0.5.0" }

defmt = { version = "1.0.1", optional = true }
defmt-rtt = { version = "1.0.0", optional = true }
panic-reset = { version = "0.1.1" }
embedded-hal = { version = "0.2.6" }

cortex-m = { version = "0.7.6", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.0"

[features]
defmt = [
      "dep:defmt",
      "dep:defmt-rtt",
      "embassy-stm32/defmt",
      "embassy-boot-stm32/defmt",
      "embassy-sync/defmt",
]
skip-include = []

[package.metadata.embassy]
build = [
  { target = "thumbv7em-none-eabi", features = ["skip-include"], artifact-dir = "out/examples/boot/stm32l4" }
]
